schema_version: 1

profile_name: MuMu 900x1600 initial calibration
game:
  display_name: 天天象棋
  package_name: com.tencent.qqgame.xq
  package_name_note: 已由 2026-11-12 用户提供的 MuMu 诊断报告核实，安装版本 4.3.0.2

device:
  emulator_vendor: MuMu
  screenshot_width: 900
  screenshot_height: 1600
  density_dpi: 240
  calibration_source: user_supplied_android_internal_screenshot
  calibration_note: >
    四角由 2026-11-12 提供的 900x1600 Android 内部截图重新测量，
    修正了旧配置整体偏上的 36 像素；如果棋盘布局或分辨率变化，请重新校准。

capture:
  source: android_internal_screencap
  controller: adb

board:
  columns: 9
  rows: 10
  image_origin: top_left
  calibration:
    method: manual_four_corner
    coordinate_space: adb_screenshot_pixels
    corners_tl_tr_br_bl:
      - [66, 363]
      - [834, 363]
      - [834, 1227]
      - [66, 1227]
    source_width: 900
    source_height: 1600
  crop_half_size_ratio: 0.42

background_display:
  width: 900
  height: 1600
  density_dpi: 240
  orientation: portrait
  calibration_profile: mumu_900x1600

scene:
  mode: auto
  supported_modes:
    - standard
    - puzzle

orientation:
  red_side: bottom
