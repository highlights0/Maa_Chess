[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maa-xiangqi"
version = "0.1.0"
description = "MaaFramework-based Android Xiangqi assistant for Tiantian Xiangqi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "maafw",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
vision = [
    "onnxruntime>=1.17",
]

[project.scripts]
maa-xiangqi = "maa_xiangqi.cli:main"
maa-xiangqi-diagnose = "maa_xiangqi.diagnostics_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
